# Quarkus configuration placeholder for SVP Platform backend
quarkus.http.port=8080

# Database (PostgreSQL + PostGIS) placeholder
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/svp
quarkus.datasource.username=svp
quarkus.datasource.password=svp

# Flyway baseline
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# JWT placeholder configuration
mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=https://svp.local
