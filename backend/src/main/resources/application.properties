# Quarkus — SVP Platform backend
quarkus.http.port=8080

# PostgreSQL + PostGIS (surcharge standard Quarkus via variables d’environnement)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/svp
quarkus.datasource.username=svp
quarkus.datasource.password=svp

# Redis — utilisé quand un bean injecte RedisClient (S0-2)
quarkus.redis.hosts=redis://localhost:6379
# Pas de check tant qu’aucun code n’utilise Redis (évite échec local sans conteneur Redis)
quarkus.redis.health.enabled=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# JWT
mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=https://svp.local

# Health aggregé : https://quarkus.io/guides/smallrye-health
quarkus.smallrye-health.root-path=/q/health
