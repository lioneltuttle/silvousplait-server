<div>
    <h2 id="page-heading">
        <span jhiTranslate="silvousplaitApp.companyLocation.home.title">Company Locations</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-company-location" [routerLink]="['/company-location/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="silvousplaitApp.companyLocation.home.createLabel">
            Create new Company Location
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="table-responsive" *ngIf="companyLocations">
        <table class="table table-striped">
            <thead>
            <tr>
            <th><span jhiTranslate="global.field.id">ID</span></th>
            <th><span jhiTranslate="silvousplaitApp.companyLocation.adresse">Adresse</span></th>
            <th><span jhiTranslate="silvousplaitApp.companyLocation.professional">Professional</span></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let companyLocation of companyLocations ;trackBy: trackId">
                <td><a [routerLink]="['/company-location', companyLocation.id, 'view' ]">{{companyLocation.id}}</a></td>
                <td>{{companyLocation.adresse}}</td>
                <td>
                    <div *ngIf="companyLocation.professionalId">
                        <a [routerLink]="['../company', companyLocation.professionalId , 'view' ]" >{{companyLocation.professionalId}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/company-location', companyLocation.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/company-location', companyLocation.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/', 'company-location', { outlets: { popup: companyLocation.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
