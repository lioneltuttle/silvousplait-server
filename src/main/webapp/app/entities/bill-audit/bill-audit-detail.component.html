<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="billAudit">
            <h2><span jhiTranslate="silvousplaitApp.billAudit.detail.title">Bill Audit</span> {{billAudit.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="silvousplaitApp.billAudit.date">Date</span></dt>
                <dd>
                    <span>{{billAudit.date}}</span>
                </dd>
                <dt><span jhiTranslate="silvousplaitApp.billAudit.message">Message</span></dt>
                <dd>
                    <span>{{billAudit.message}}</span>
                </dd>
                <dt><span jhiTranslate="silvousplaitApp.billAudit.event">Event</span></dt>
                <dd>
                    <span jhiTranslate="{{'silvousplaitApp.BillEvent.' + billAudit.event}}">{{billAudit.event}}</span>
                </dd>
                <dt><span jhiTranslate="silvousplaitApp.billAudit.bill">Bill</span></dt>
                <dd>
                    <div *ngIf="billAudit.billId">
                        <a [routerLink]="['/bill', billAudit.billId, 'view']">{{billAudit.billId}}</a>
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/bill-audit', billAudit.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
