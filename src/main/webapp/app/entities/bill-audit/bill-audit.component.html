<div>
    <h2 id="page-heading">
        <span jhiTranslate="silvousplaitApp.billAudit.home.title">Bill Audits</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-bill-audit" [routerLink]="['/bill-audit/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="silvousplaitApp.billAudit.home.createLabel">
            Create a new Bill Audit
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="billAudits?.length === 0">
        <span jhiTranslate="silvousplaitApp.billAudit.home.notFound">No billAudits found</span>
    </div>
    <div class="table-responsive" *ngIf="billAudits?.length > 0">
        <table class="table table-striped">
            <thead>
            <tr>
            <th><span jhiTranslate="global.field.id">ID</span></th>
            <th><span jhiTranslate="silvousplaitApp.billAudit.date">Date</span></th>
            <th><span jhiTranslate="silvousplaitApp.billAudit.message">Message</span></th>
            <th><span jhiTranslate="silvousplaitApp.billAudit.event">Event</span></th>
            <th><span jhiTranslate="silvousplaitApp.billAudit.bill">Bill</span></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let billAudit of billAudits ;trackBy: trackId">
                <td><a [routerLink]="['/bill-audit', billAudit.id, 'view' ]">{{billAudit.id}}</a></td>
                <td>{{billAudit.date | date:'mediumDate'}}</td>
                <td>{{billAudit.message}}</td>
                <td jhiTranslate="{{'silvousplaitApp.BillEvent.' + billAudit.event}}">{{billAudit.event}}</td>
                <td>
                    <div *ngIf="billAudit.billId">
                        <a [routerLink]="['/bill', billAudit.billId , 'view' ]" >{{billAudit.billId}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/bill-audit', billAudit.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/bill-audit', billAudit.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/bill-audit', { outlets: { popup: billAudit.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
