<div>
    <h2 id="page-heading">
        <span jhiTranslate="silvousplaitApp.proResponse.home.title">Pro Responses</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-pro-response" [routerLink]="['/pro-response/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="silvousplaitApp.proResponse.home.createLabel">
            Create a new Pro Response
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="proResponses?.length === 0">
        <span jhiTranslate="silvousplaitApp.proResponse.home.notFound">No proResponses found</span>
    </div>
    <div class="table-responsive" *ngIf="proResponses?.length > 0">
        <table class="table table-striped">
            <thead>
            <tr>
            <th><span jhiTranslate="global.field.id">ID</span></th>
            <th><span jhiTranslate="silvousplaitApp.proResponse.accept">Accept</span></th>
            <th><span jhiTranslate="silvousplaitApp.proResponse.request">Request</span></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let proResponse of proResponses ;trackBy: trackId">
                <td><a [routerLink]="['/pro-response', proResponse.id, 'view' ]">{{proResponse.id}}</a></td>
                <td>{{proResponse.accept}}</td>
                <td>
                    <div *ngIf="proResponse.requestId">
                        <a [routerLink]="['/pro-request', proResponse.requestId , 'view' ]" >{{proResponse.requestId}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/pro-response', proResponse.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/pro-response', proResponse.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/pro-response', { outlets: { popup: proResponse.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
