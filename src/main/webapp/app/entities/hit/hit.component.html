<div>
    <h2 id="page-heading">
        <span jhiTranslate="silvousplaitApp.hit.home.title">Hits</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-hit" [routerLink]="['/hit/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="silvousplaitApp.hit.home.createLabel">
            Create a new Hit
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="hits?.length === 0">
        <span jhiTranslate="silvousplaitApp.hit.home.notFound">No hits found</span>
    </div>
    <div class="table-responsive" *ngIf="hits?.length > 0">
        <table class="table table-striped">
            <thead>
            <tr>
            <th><span jhiTranslate="global.field.id">ID</span></th>
            <th><span jhiTranslate="silvousplaitApp.hit.date">Date</span></th>
            <th><span jhiTranslate="silvousplaitApp.hit.answered">Answered</span></th>
            <th><span jhiTranslate="silvousplaitApp.hit.transformed">Transformed</span></th>
            <th><span jhiTranslate="silvousplaitApp.hit.professional">Professional</span></th>
            <th><span jhiTranslate="silvousplaitApp.hit.customer">Customer</span></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let hit of hits ;trackBy: trackId">
                <td><a [routerLink]="['/hit', hit.id, 'view' ]">{{hit.id}}</a></td>
                <td>{{hit.date | date:'mediumDate'}}</td>
                <td>{{hit.answered}}</td>
                <td>{{hit.transformed}}</td>
                <td>
                    <div *ngIf="hit.professionalId">
                        <a [routerLink]="['/professional', hit.professionalId , 'view' ]" >{{hit.professionalId}}</a>
                    </div>
                </td>
                <td>
                    <div *ngIf="hit.customerId">
                        <a [routerLink]="['/customer', hit.customerId , 'view' ]" >{{hit.customerId}}</a>
                    </div>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/hit', hit.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/hit', hit.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/hit', { outlets: { popup: hit.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
