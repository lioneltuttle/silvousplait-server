<div>
    <h2 id="page-heading">
        <span jhiTranslate="silvousplaitApp.professionalProfileImage.home.title">Professional Profile Images</span>
        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-professional-profile-image" [routerLink]="['/professional-profile-image/new']">
            <fa-icon [icon]="'plus'"></fa-icon>
            <span  jhiTranslate="silvousplaitApp.professionalProfileImage.home.createLabel">
            Create a new Professional Profile Image
            </span>
        </button>
    </h2>
    <jhi-alert></jhi-alert>
    <br/>
    <div class="alert alert-warning" *ngIf="professionalProfileImages?.length === 0">
        <span jhiTranslate="silvousplaitApp.professionalProfileImage.home.notFound">No professionalProfileImages found</span>
    </div>
    <div class="table-responsive" *ngIf="professionalProfileImages?.length > 0">
        <table class="table table-striped">
            <thead>
            <tr>
            <th><span jhiTranslate="global.field.id">ID</span></th>
            <th><span jhiTranslate="silvousplaitApp.professionalProfileImage.proId">Pro Id</span></th>
            <th><span jhiTranslate="silvousplaitApp.professionalProfileImage.image">Image</span></th>
            <th></th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let professionalProfileImage of professionalProfileImages ;trackBy: trackId">
                <td><a [routerLink]="['/professional-profile-image', professionalProfileImage.id, 'view' ]">{{professionalProfileImage.id}}</a></td>
                <td>{{professionalProfileImage.proId}}</td>
                <td>
                    <a *ngIf="professionalProfileImage.image" (click)="openFile(professionalProfileImage.imageContentType, professionalProfileImage.image)" jhiTranslate="entity.action.open">open</a>
                    <span *ngIf="professionalProfileImage.image">{{professionalProfileImage.imageContentType}}, {{byteSize(professionalProfileImage.image)}}</span>
                </td>
                <td class="text-right">
                    <div class="btn-group">
                        <button type="submit"
                                [routerLink]="['/professional-profile-image', professionalProfileImage.id, 'view' ]"
                                class="btn btn-info btn-sm">
                            <fa-icon [icon]="'eye'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/professional-profile-image', professionalProfileImage.id, 'edit']"
                                class="btn btn-primary btn-sm">
                            <fa-icon [icon]="'pencil-alt'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                        </button>
                        <button type="submit"
                                [routerLink]="['/professional-profile-image', { outlets: { popup: professionalProfileImage.id + '/delete'} }]"
                                replaceUrl="true"
                                queryParamsHandling="merge"
                                class="btn btn-danger btn-sm">
                            <fa-icon [icon]="'times'"></fa-icon>
                            <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
