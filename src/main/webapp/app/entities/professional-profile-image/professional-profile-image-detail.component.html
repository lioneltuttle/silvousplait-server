<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="professionalProfileImage">
            <h2><span jhiTranslate="silvousplaitApp.professionalProfileImage.detail.title">Professional Profile Image</span> {{professionalProfileImage.id}}</h2>
            <hr>
            <jhi-alert-error></jhi-alert-error>
            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="silvousplaitApp.professionalProfileImage.proId">Pro Id</span></dt>
                <dd>
                    <span>{{professionalProfileImage.proId}}</span>
                </dd>
                <dt><span jhiTranslate="silvousplaitApp.professionalProfileImage.image">Image</span></dt>
                <dd>
                    <div *ngIf="professionalProfileImage.image">
                        <a (click)="openFile(professionalProfileImage.imageContentType, professionalProfileImage.image)" jhiTranslate="entity.action.open">open</a>
                        {{professionalProfileImage.imageContentType}}, {{byteSize(professionalProfileImage.image)}}
                    </div>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon [icon]="'arrow-left'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/professional-profile-image', professionalProfileImage.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon [icon]="'pencil-alt'"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </div>
    </div>
</div>
