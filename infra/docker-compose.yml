version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: svp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: svp
      POSTGRES_USER: svp
      POSTGRES_PASSWORD: svp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svp -d svp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: svp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  openrouteservice:
    image: openrouteservice/openrouteservice:latest
    container_name: svp_ors
    restart: unless-stopped
    profiles: ["ors"]
    environment:
      - "JAVA_OPTS=-Xms2g -Xmx2g"
      - "ORS_CONFIG=/ors-config/ors-config.json"
    volumes:
      - ors_data:/var/ors
      - ./ors-config:/ors-config
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ors/v2/health | grep -q OK || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30

volumes:
  postgres_data:
  ors_data:
